        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            switch (state.view) {
                case 'welcome': app.appendChild(viewWelcome()); break;
                case 'unit_select': app.appendChild(viewUnitSelect()); break;
                case 'dashboard': app.appendChild(viewDashboard()); break;
                case 'theory': app.appendChild(viewTheory()); break;
                case 'quiz': app.appendChild(viewQuiz()); break;
                case 'final_results': app.appendChild(viewFinalResults()); break;
            }
        }

                </div>
            `;
            return div;
        }

        function viewUnitSelect() {
            const div = document.createElement('div');
            div.className = 'flex-grow flex flex-col items-center justify-center fade-in py-10';
            div.innerHTML = `
                <h2 class="text-3xl font-bold mb-10 text-white">Tria quina Unitat vols repassar:</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
                    <div onclick="selectUnit(5)" class="bg-white p-8 rounded-[2rem] text-slate-800 cursor-pointer kahoot-btn text-center border-b-8 border-indigo-200">
                        <div class="text-6xl mb-4">🌍</div>
                        <h3 class="text-2xl font-bold">Unitat 5</h3>
                        <p class="text-slate-400">Ens fa falta?</p>
                    </div>
                    <div onclick="selectUnit(6)" class="bg-white p-8 rounded-[2rem] text-slate-800 cursor-pointer kahoot-btn text-center border-b-8 border-sky-200">
                        <div class="text-6xl mb-4">📖</div>
                        <h3 class="text-2xl font-bold">Unitat 6</h3>
                        <p class="text-slate-400">L'aventura de llegir</p>
                    </div>
                </div>
            `;
            return div;
        }

        function viewDashboard() {
            const unit = unitData[state.currentUnit];
            const div = document.createElement('div');
            div.className = 'fade-in py-6';
            div.innerHTML = `
                <div class="flex justify-between items-center mb-10">
                    <button onclick="state.view='unit_select'; render()" class="bg-white/20 p-3 rounded-xl hover:bg-white/30 transition">⬅ Tornar</button>
                    <div class="text-right">
                        <p class="text-white/60 text-sm font-bold uppercase">Jugador: ${state.userName}</p>
                        <p class="text-2xl font-bold">${state.score} pts</p>
                    </div>
                </div>
                <h1 class="text-4xl font-bold mb-8 text-center">${unit.title}</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${unit.modules.map((m, i) => `
                        <div onclick="openTheory(${i})" class="bg-white rounded-[2rem] p-6 text-slate-800 cursor-pointer kahoot-btn flex items-center gap-4 relative overflow-hidden">
                            <div class="text-4xl">${m.icon}</div>
                            <div>
                                <h3 class="font-bold text-lg">${m.title}</h3>
                                <p class="text-xs text-slate-400 uppercase font-bold">10 preguntes</p>
                            </div>
                            ${state.unitProgress[state.currentUnit][i] ? '<div class="absolute right-4 top-1/2 -translate-y-1/2 text-green-500 text-2xl font-bold">✓</div>' : ''}
                        </div>
                    `).join('')}
                </div>
            `;
            return div;
        }

        function viewTheory() {
            const m = unitData[state.currentUnit].modules[state.currentModuleIndex];
            const div = document.createElement('div');
            div.className = 'flex-grow flex flex-col items-center justify-center fade-in py-10';
            div.innerHTML = `
                <div class="bg-white rounded-[2.5rem] p-10 text-slate-800 max-w-2xl w-full shadow-2xl">
                    <div class="flex items-center gap-4 mb-6">
                        <span class="text-5xl">${m.icon}</span>
                        <h2 class="text-3xl font-bold">${m.title}</h2>
                    </div>
                    <div class="bg-purple-50 p-8 rounded-3xl text-xl mb-8 border-l-8 border-purple-500">
                        ${m.theory}
                    </div>
                    <div class="flex gap-4">
                        <button onclick="state.view='dashboard'; render()" class="flex-1 py-5 bg-slate-200 text-slate-600 rounded-2xl font-bold text-xl kahoot-btn">Tornar</button>
                        <button onclick="startQuiz()" class="flex-[2] py-5 k-green text-white rounded-2xl font-bold text-2xl kahoot-btn">Estic llest!</button>
                    </div>
                </div>
            `;
            return div;
        }

        function viewQuiz() {
            const m = unitData[state.currentUnit].modules[state.currentModuleIndex];
            const q = m.questions[state.currentQuestionIndex];
            const div = document.createElement('div');
            div.className = 'flex-grow flex flex-col fade-in py-4 h-full';
            
            const shapes = [
                '<svg class="shape-icon" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2z"/></svg>', // Triange
                '<svg class="shape-icon" viewBox="0 0 24 24"><path d="M12 2l10 10-10 10L2 12z"/></svg>', // Diamond
                '<svg class="shape-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>', // Circle
                '<svg class="shape-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/></svg>' // Square
            ];
            const colors = ['k-red', 'k-blue', 'k-yellow', 'k-green'];

            div.innerHTML = `
                <div class="bg-white text-slate-800 p-8 rounded-3xl text-center shadow-xl mb-8 relative">
                    <div class="absolute -top-4 left-1/2 -translate-x-1/2 bg-purple-600 text-white px-6 py-1 rounded-full font-bold text-sm">
                        PREGUNTA ${state.currentQuestionIndex + 1} / 10
                    </div>
                    <h2 class="text-3xl md:text-4xl font-bold py-6">${q.q}</h2>
                </div>
                
                <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${q.a.map((opt, i) => `
                        <button onclick="checkAnswer(${i})" class="${colors[i]} p-6 rounded-xl flex items-center gap-6 text-white text-2xl font-bold kahoot-btn text-left overflow-hidden relative">
                            <div class="bg-white/20 p-3 rounded-lg">${shapes[i]}</div>
                            <span>${opt}</span>
                        </button>
                    `).join('')}
                </div>
            `;
            return div;
        }

        function viewFinalResults() {
            const div = document.createElement('div');
            div.className = 'flex-grow flex flex-col items-center justify-center fade-in text-center';
            div.innerHTML = `
                <div class="bg-white p-12 rounded-[3rem] shadow-2xl text-slate-800 max-w-lg w-full">
                    <div class="text-8xl mb-6">🏆</div>
                    <h1 class="text-4xl font-bold mb-2">Molt bé, ${state.userName}!</h1>
                    <p class="text-xl text-slate-400 mb-8">Has aconseguit una puntuació increïble:</p>
                    <div class="text-7xl font-bold text-purple-600 mb-10">${state.score}</div>
                    <button onclick="state.view='unit_select'; render()" class="w-full py-5 k-blue text-white rounded-2xl font-bold text-2xl kahoot-btn">Canviar Unitat</button>
                </div>
            `;
            return div;
        }

        // LÒGICA
        function startApp() {
            const input = document.getElementById('nameInput');
            if (!input.value.trim()) return;
            state.userName = input.value;
            state.view = 'unit_select';
            render();
        }

        function selectUnit(u) {
            state.currentUnit = u;
            state.view = 'dashboard';
            render();
        }

        function openTheory(idx) {
            state.currentModuleIndex = idx;
            state.view = 'theory';
            render();
        }

        function startQuiz() {
            state.currentQuestionIndex = 0;
            state.view = 'quiz';
            render();
        }

        function checkAnswer(idx) {
            const m = unitData[state.currentUnit].modules[state.currentModuleIndex];
            const q = m.questions[state.currentQuestionIndex];
            const isCorrect = idx === q.c;
            
            if (isCorrect) state.score += 100;

            showFeedback(isCorrect, q.exp, q.a[q.c]);
        }

        function showFeedback(isCorrect, exp, correctVal) {
            const div = document.createElement('div');
            div.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm fade-in';
            div.innerHTML = `
                <div class="bg-white rounded-[2.5rem] p-10 max-w-sm w-full text-center shadow-2xl border-t-8 ${isCorrect ? 'border-green-500' : 'border-red-500'}">
                    <div class="text-6xl mb-4">${isCorrect ? '🎉' : '❌'}</div>
                    <h2 class="text-3xl font-bold mb-2 ${isCorrect ? 'text-green-500' : 'text-red-500'}">${isCorrect ? 'Correcte!' : 'Ooooh!'}</h2>
                    ${!isCorrect ? `<p class="text-slate-400 font-bold mb-2 uppercase text-xs">La resposta era: ${correctVal}</p>` : ''}
                    <div class="bg-slate-50 p-6 rounded-2xl text-slate-600 mb-8">${exp}</div>
                    <button onclick="closeFeedback()" class="w-full py-5 ${isCorrect ? 'k-green' : 'k-red'} text-white rounded-2xl font-bold text-xl kahoot-btn">Següent</button>
                </div>
            `;
            document.body.appendChild(div);
        }

        function closeFeedback() {
            document.querySelector('.fixed').remove();
            state.currentQuestionIndex++;
            if (state.currentQuestionIndex >= 10) {
                state.unitProgress[state.currentUnit][state.currentModuleIndex] = true;
                
                // Comprovar si unitat acabada
                if (state.unitProgress[state.currentUnit].every(v => v === true)) {
                    state.view = 'final_results';
                } else {
                    state.view = 'dashboard';
                }
            }
            render();
        }

        // Inicialitzar
        render();
    </script>
</body>
</html>
