<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto de Supervivencia: Destino Nueva York</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: #e0f2fe;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .ocean-bg {
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .transition-all-custom {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hidden-screen {
            display: none !important;
        }
        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        /* Animación de nubes */
        @keyframes moveClouds {
            from { transform: translateX(-100%); }
            to { transform: translateX(100vw); }
        }
        .cloud {
            position: absolute;
            opacity: 0.3;
            animation: moveClouds 20s linear infinite;
        }
    </style>
</head>
<body class="ocean-bg flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Elementos Decorativos -->
    <div class="cloud text-6xl top-10" style="animation-duration: 25s;">☁️</div>
    <div class="cloud text-4xl top-40" style="animation-duration: 18s; animation-delay: 5s;">☁️</div>
    <div class="cloud text-5xl top-80" style="animation-duration: 30s; animation-delay: 2s;">☁️</div>

    <div id="main-container" class="w-full max-w-2xl glass-card rounded-[2rem] shadow-2xl relative z-10 overflow-hidden flex flex-col min-h-[85vh]">
        
        <!-- BARRA DE ESTADO (Siempre visible después de iniciar) -->
        <div id="hud" class="hidden-screen bg-white/80 border-b p-4 flex justify-between items-center">
            <div class="flex flex-col gap-1 w-2/3">
                <div class="flex justify-between text-xs font-bold text-blue-800 mb-1">
                    <span id="display-name">Piloto</span>
                    <span>Fuel: <span id="fuel-count">0</span>/100</span>
                </div>
                <div class="w-full bg-blue-100 rounded-full h-4 relative overflow-hidden border border-blue-200">
                    <div id="fuel-progress" class="bg-gradient-to-r from-yellow-400 to-orange-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>
            <div class="flex flex-col items-center">
                <div id="plane-avatar" class="text-4xl transition-all duration-700">🛩️</div>
                <span id="altitude-label" class="text-[10px] font-bold uppercase text-blue-500">Altitud Baja</span>
            </div>
        </div>

        <!-- PANTALLA 1: BIENVENIDA -->
        <div id="screen-welcome" class="flex-1 flex flex-col items-center justify-center p-8 text-center space-y-6">
            <div class="relative">
                <div class="text-8xl animate-bounce">✈️</div>
                <div class="absolute -bottom-2 -right-2 text-4xl">🌊</div>
            </div>
            <h1 class="text-4xl font-extrabold text-blue-900 leading-tight">Vuelo Transatlántico<br><span class="text-blue-500 text-2xl">Misión Castellano (5 y 6)</span></h1>
            <p class="text-gray-600 max-w-sm">Cruza el océano hasta Nueva York. Necesitas 40 puntos de fuel para no caer al agua. ¡Con 100 puntos serás Leyenda!</p>
            
            <div class="w-full max-w-xs space-y-4">
                <input type="text" id="player-name-input" placeholder="Nombre del Piloto" 
                    class="w-full px-6 py-4 rounded-2xl border-2 border-blue-100 focus:border-blue-500 focus:outline-none text-center text-xl shadow-inner bg-blue-50/50">
                <button id="btn-start" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl text-xl shadow-lg transform active:scale-95 transition-all">
                    Iniciar Vuelo
                </button>
            </div>
        </div>

        <!-- PANTALLA 2: DASHBOARD (MAPA) -->
        <div id="screen-dashboard" class="hidden-screen flex-1 p-6 flex flex-col">
            <h2 class="text-2xl font-bold text-blue-900 mb-4 flex items-center gap-2">
                🗺️ Mapa de Navegación
            </h2>
            <div id="module-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4 flex-1">
                <!-- Módulos inyectados por JS -->
            </div>
        </div>

        <!-- PANTALLA 3: PREGUNTA -->
        <div id="screen-quiz" class="hidden-screen flex-1 p-6 flex flex-col">
            <div class="mb-4">
                <span id="current-module-title" class="text-xs font-bold text-blue-500 uppercase tracking-widest bg-blue-50 px-3 py-1 rounded-full">Tema</span>
            </div>
            <h3 id="question-text" class="text-xl font-bold text-gray-800 mb-8 leading-snug">¿Cargando pregunta?</h3>
            <div id="options-grid" class="grid grid-cols-1 gap-3">
                <!-- Botones de opciones -->
            </div>
        </div>

        <!-- PANTALLA 4: FEEDBACK -->
        <div id="screen-feedback" class="hidden-screen flex-1 p-8 flex flex-col items-center justify-center text-center">
            <div id="feedback-icon" class="text-7xl mb-4"></div>
            <h2 id="feedback-title" class="text-3xl font-bold mb-4"></h2>
            <div class="bg-blue-50 p-6 rounded-2xl border-2 border-blue-100 mb-8 w-full">
                <p id="feedback-text" class="text-gray-700 leading-relaxed"></p>
            </div>
            <button id="btn-next" class="w-full bg-blue-900 text-white font-bold py-4 rounded-2xl text-xl shadow-md transform active:scale-95 transition-all">
                Continuar Vuelo
            </button>
        </div>

        <!-- PANTALLA 5: FINAL -->
        <div id="screen-end" class="hidden-screen flex-1 p-8 flex flex-col items-center justify-center text-center space-y-6">
            <div id="end-emoji" class="text-9xl"></div>
            <h1 id="end-title" class="text-4xl font-black text-blue-900"></h1>
            <p id="end-message" class="text-lg text-gray-600"></p>
            <div class="bg-white border-4 border-blue-500 p-4 rounded-3xl">
                <p class="text-sm font-bold text-blue-500 uppercase">Puntuación Final</p>
                <p class="text-5xl font-black text-blue-900"><span id="final-score">0</span>/100</p>
            </div>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold hover:bg-blue-700">
                Intentar de nuevo
            </button>
        </div>

    </div>

    <script>
        // DATOS DEL JUEGO (Basado en PDF Temas 5 y 6)
        const gameData = [
            {
                id: 1,
                title: "Prefijos de Situación",
                icon: "📍",
                questions: [
                    { q: "¿Qué significa el prefijo 'sub-' en la palabra 'subsuelo'?", options: ["Al lado de", "Debajo de", "Encima de"], correct: 1, exp: "El prefijo 'sub-' indica situación inferior o 'debajo de'." },
                    { q: "¿Cuál es el prefijo que significa 'delante de'?", options: ["Sub-", "Extra-", "Ante-"], correct: 2, exp: "'Ante-' indica prioridad o posición delantera (ej. antebrazo)." },
                    { q: "La palabra 'extraordinario' significa...", options: ["Muy normal", "Fuera de lo normal", "Debajo de lo normal"], correct: 1, exp: "El prefijo 'extra-' significa 'fuera de' o 'más allá de'." },
                    { q: "¿Cómo se llama el prefijo de 'sobrevolar'?", options: ["Sobre-", "Sub-", "Extra-"], correct: 0, exp: "'Sobre-' indica posición superior." }
                ]
            },
            {
                id: 2,
                title: "Adjetivos con V",
                icon: "✍️",
                questions: [
                    { q: "Los adjetivos terminados en -ave, -avo, -eva, -evo, -ivo, -iva se escriben con...", options: ["B", "V", "H"], correct: 1, exp: "Es una regla ortográfica: octavo, suave, nueva, deportivo..." },
                    { q: "¿Cómo se escribe el antónimo de 'alegre'?", options: ["Grave", "Grabe", "Gravre"], correct: 0, exp: "Grave se escribe con 'v' porque termina en -ave." },
                    { q: "Selecciona la palabra correcta:", options: ["Nuebo", "Nueva", "Nuera"], correct: 1, exp: "Nueva es un adjetivo terminado en -eva, por tanto lleva 'v'." },
                    { q: "¿Qué terminación falta en: 'El coche es muy deport___'?", options: ["-ibo", "-ivo", "-ivo con h"], correct: 1, exp: "Deportivo termina en -ivo, se escribe con 'v'." }
                ]
            },
            {
                id: 3,
                title: "Numerales e Indefinidos",
                icon: "🔢",
                questions: [
                    { q: "¿Qué tipo de palabra es 'quinto'?", options: ["Numeral Cardinal", "Numeral Ordinal", "Indefinido"], correct: 1, exp: "Los ordinales expresan orden (primero, segundo...)." },
                    { q: "¿Cuál de estas palabras es un INDEFINIDO?", options: ["Tres", "Muchos", "Siete"], correct: 1, exp: "Los indefinidos expresan cantidad de forma imprecisa." },
                    { q: "En 'Tengo siete lápices', la palabra 'siete' es...", options: ["Numeral Cardinal", "Numeral Ordinal", "Indefinido"], correct: 0, exp: "Los cardinales expresan cantidades exactas." },
                    { q: "'Varios niños jugaban'. 'Varios' es...", options: ["Numeral", "Indefinido", "Nombre"], correct: 1, exp: "Varios indica una cantidad no exacta." }
                ]
            },
            {
                id: 4,
                title: "Sufijos y Verbos",
                icon: "⚙️",
                questions: [
                    { q: "¿Qué es un sufijo?", options: ["Partícula al principio", "Partícula al final", "Una rima"], correct: 1, exp: "Los sufijos se añaden al final para formar palabras nuevas." },
                    { q: "¿Qué palabra tiene el sufijo '-ero'?", options: ["Frutero", "Prefijo", "Extraer"], correct: 0, exp: "Fruta + ero = Frutero (persona u objeto relacionado)." },
                    { q: "La forma de nombrar a un verbo es el...", options: ["Conjugación", "Sufijo", "Infinitivo"], correct: 2, exp: "El infinitivo es el nombre del verbo (cantar, reír)." },
                    { q: "¿A qué conjugación pertenece 'vivir'?", options: ["1ª (-ar)", "2ª (-er)", "3ª (-ir)"], correct: 2, exp: "Los verbos terminados en -ir son de la tercera conjugación." }
                ]
            },
            {
                id: 5,
                title: "Ortografía G y J",
                icon: "🔤",
                questions: [
                    { q: "Los verbos terminados en -ger y -gir se escriben con...", options: ["J", "G", "V"], correct: 1, exp: "Regla: escoger, dirigir, rugir... llevan G." },
                    { q: "¿Cuáles son las excepciones de -ger / -gir?", options: ["Coger y elegir", "Tejer y crujir", "Rugir y fingir"], correct: 1, exp: "Tejer y crujir son las excepciones que van con J." },
                    { q: "Completa: 'Debemos prote__er la naturaleza'", options: ["g", "j", "h"], correct: 0, exp: "Proteger acaba en -ger, va con G." },
                    { q: "¿Cómo se escribe?", options: ["Crujir", "Crugir", "Crurir"], correct: 0, exp: "Crujir es una excepción y va con J." }
                ]
            }
        ];

        // Estado del Juego
        let state = {
            name: "",
            score: 0,
            currentModule: null,
            currentQuestionIdx: 0,
            completedModules: []
        };

        // Referencias DOM
        const screens = ['screen-welcome', 'screen-dashboard', 'screen-quiz', 'screen-feedback', 'screen-end'];
        const hud = document.getElementById('hud');
        const playerNameInput = document.getElementById('player-name-input');
        const btnStart = document.getElementById('btn-start');

        // Función para cambiar de pantalla
        function showScreen(screenId) {
            screens.forEach(id => document.getElementById(id).classList.add('hidden-screen'));
            document.getElementById(screenId).classList.remove('hidden-screen');
        }

        // Lógica de Inicio
        btnStart.addEventListener('click', () => {
            const name = playerNameInput.value.trim();
            if (name.length < 2) {
                playerNameInput.classList.add('border-red-500');
                setTimeout(() => playerNameInput.classList.remove('border-red-500'), 1000);
                return;
            }
            state.name = name;
            document.getElementById('display-name').innerText = state.name;
            hud.classList.remove('hidden-screen');
            renderDashboard();
            showScreen('screen-dashboard');
        });

        // Renderizar el mapa de módulos
        function renderDashboard() {
            const list = document.getElementById('module-list');
            list.innerHTML = "";
            
            gameData.forEach(mod => {
                const isCompleted = state.completedModules.includes(mod.id);
                const card = document.createElement('div');
                card.className = `module-card cursor-pointer p-4 rounded-2xl border-2 transition-all-custom flex flex-col items-center justify-center text-center space-y-2 ${isCompleted ? 'bg-green-50 border-green-200' : 'bg-white border-blue-100 hover:border-blue-400'}`;
                
                card.innerHTML = `
                    <div class="text-4xl">${isCompleted ? '✅' : mod.icon}</div>
                    <div class="font-bold text-blue-900">${mod.title}</div>
                    <div class="text-[10px] text-blue-400 font-bold uppercase">${isCompleted ? 'Completado' : mod.questions.length + ' Preguntas'}</div>
                `;
                
                if (!isCompleted) {
                    card.onclick = () => startModule(mod);
                }
                list.appendChild(card);
            });

            // Verificar si todos los módulos están completos para ir al final
            if (state.completedModules.length === gameData.length) {
                setTimeout(endGame, 1000);
            }
        }

        function startModule(mod) {
            state.currentModule = mod;
            state.currentQuestionIdx = 0;
            showQuestion();
            showScreen('screen-quiz');
        }

        function showQuestion() {
            const mod = state.currentModule;
            const q = mod.questions[state.currentQuestionIdx];
            
            document.getElementById('current-module-title').innerText = mod.title;
            document.getElementById('question-text').innerText = q.q;
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = "";
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border-2 border-blue-50 hover:bg-blue-50 hover:border-blue-300 transition-all font-medium text-gray-700 bg-white shadow-sm";
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(idx);
                grid.appendChild(btn);
            });
        }

        function handleAnswer(idx) {
            const q = state.currentModule.questions[state.currentQuestionIdx];
            const isCorrect = idx === q.correct;
            
            if (isCorrect) {
                state.score += 5; // Puntuación acelerada para demo, puedes cambiar a 1
                updateHUD();
                showFeedback(true, q.exp);
            } else {
                showFeedback(false, q.exp);
            }
        }

        function updateHUD() {
            document.getElementById('fuel-count').innerText = state.score;
            const progress = Math.min(state.score, 100);
            document.getElementById('fuel-progress').style.width = progress + "%";
            
            const plane = document.getElementById('plane-avatar');
            const label = document.getElementById('altitude-label');
            
            if (state.score >= 100) {
                plane.innerText = "🚀";
                label.innerText = "Velocidad Supersónica";
                label.className = "text-[10px] font-bold uppercase text-orange-500";
            } else if (state.score >= 40) {
                plane.innerText = "✈️";
                label.innerText = "Crucero Seguro";
                label.className = "text-[10px] font-bold uppercase text-green-500";
            } else {
                plane.innerText = "🛩️";
                label.innerText = "Altitud Baja";
            }
        }

        function showFeedback(correct, explanation) {
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            
            if (correct) {
                icon.innerText = "⚡";
                title.innerText = "¡Buen Vuelo!";
                title.className = "text-3xl font-bold mb-4 text-green-600";
            } else {
                icon.innerText = "☁️";
                title.innerText = "Turbulencia...";
                title.className = "text-3xl font-bold mb-4 text-orange-600";
            }
            
            document.getElementById('feedback-text').innerText = explanation;
            showScreen('screen-feedback');
        }

        document.getElementById('btn-next').onclick = () => {
            state.currentQuestionIdx++;
            if (state.currentQuestionIdx < state.currentModule.questions.length) {
                showQuestion();
                showScreen('screen-quiz');
            } else {
                state.completedModules.push(state.currentModule.id);
                renderDashboard();
                showScreen('screen-dashboard');
            }
        };

        function endGame() {
            hud.classList.add('hidden-screen');
            const emoji = document.getElementById('end-emoji');
            const title = document.getElementById('end-title');
            const msg = document.getElementById('end-message');
            document.getElementById('final-score').innerText = state.score;

            if (state.score >= 100) {
                emoji.innerText = "🗽🚀";
                title.innerText = "¡ERES UNA LEYENDA!";
                msg.innerText = `¡Increíble ${state.name}! Tu avión se transformó en un súper-cohete y has llegado a Nueva York rompiendo todos los récords.`;
            } else if (state.score >= 40) {
                emoji.innerText = "🏙️🛬";
                title.innerText = "¡BIENVENIDO A NY!";
                msg.innerText = `¡Lo lograste, ${state.name}! Con fuel suficiente para aterrizar en la Gran Manzana. ¡Misión cumplida!`;
            } else {
                emoji.innerText = "🛟🌊";
                title.innerText = "AMERIZAJE FORZOSO";
                msg.innerText = `Lo sentimos ${state.name}, no hubo fuel suficiente para llegar a la costa. ¡Repasa los temas 5 y 6 y vuelve a despegar!`;
            }
            
            showScreen('screen-end');
        }
    </script>
</body>
</html>
